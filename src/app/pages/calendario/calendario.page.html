<ion-header>
    <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/lista-tareas"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'CALENDAR.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-datetime
    [(ngModel)]="selectedDate"
    (ionChange)="onDateChange($event)"
    presentation="date"
    [locale]="locale"
    picker-format="DD MM YYYY"
    display-format="DD/MM/YYYY"
    [min]="minDate">
  </ion-datetime>

  <div *ngIf="selectedDate">
    <h2 style="margin-top:15px;">
      {{ 'CALENDAR.TASKS_FOR' | translate:{ date: formatDate(selectedDate) } }}
    </h2>

    <ion-list *ngIf="selectedDateTasks.length > 0; else noTasks">
      <ion-item *ngFor="let task of selectedDateTasks">
        <ion-label>
          <h3>{{ task.title }}</h3>
          <p *ngIf="task.description">{{ task.description }}</p>
          <p>{{ task.status }}</p>
        </ion-label>
        <ion-checkbox
          slot="start"
          [checked]="task.completed"
          (ionChange)="toggleComplete(task)">
        </ion-checkbox>
          <ion-badge slot="end" [color]="task.priority === 'Alta' ? 'danger' : task.priority === 'Media' ? 'warning' : 'success'">
            {{ ('PRIORITY.' + (task.priority || '').toUpperCase()) | translate }}
          </ion-badge>
      </ion-item>
    </ion-list>

    <ng-template #noTasks>
      <ion-text color="medium" class="no-tasks">
        <p>{{ 'CALENDAR.NO_TASKS' | translate }}</p>
      </ion-text>
    </ng-template>
  </div>

  
</ion-content>
