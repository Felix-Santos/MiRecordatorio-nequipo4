<ion-header>
    <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/lista-tareas"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'HISTORY.TITLE' | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="clearHistory()" color="danger">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngIf="history.length > 0; else noHistory">
    <ion-item *ngFor="let entry of history">
      <ion-label>
        <h2>{{ ('ACTION.' + entry.action.toUpperCase()) | translate }}</h2>
        <p>{{ formatDate(entry.timestamp) }}</p>
        <p *ngIf="entry.newValue?.title" color="primary">
          Tarea: {{ entry.newValue.title }}
        </p>
      </ion-label>
      <ion-badge slot="end" [color]="getActionColor(entry.action)">
        {{ ('ACTION.' + entry.action.toUpperCase()) | translate }}
      </ion-badge>
    </ion-item>
  </ion-list>

    <ng-template #noHistory>
    <ion-text color="medium" class="no-history">
      <p>{{ 'HISTORY.NO_ACTIONS' | translate }}</p>
      <p>{{ 'HISTORY.INFO' | translate }}</p>
    </ion-text>
  </ng-template>
</ion-content>
