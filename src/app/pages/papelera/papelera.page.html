<ion-header>
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/lista-tareas"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'TRASH.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
  <ion-list *ngIf="deletedTasks.length > 0; else noDeletedTasks">
    <ion-item *ngFor="let task of deletedTasks">
      <ion-label>
        <h2>{{ task.title }}</h2>
        <p>{{ 'TRASH.DELETED_AT' | translate:{ date: formatDeletedDate(task.deletedAt!) } }}</p>
        <p *ngIf="task.description">{{ task.description }}</p>
      </ion-label>
      <ion-badge slot="end" [color]="task.priority === 'Alta' ? 'danger' : task.priority === 'Media' ? 'warning' : 'success'">
        {{ ('PRIORITY.' + (task.priority || '').toUpperCase()) | translate }}
      </ion-badge>
      <ion-button slot="end" fill="clear" color="success" (click)="restoreTask(task)">
        <ion-icon name="refresh-outline"></ion-icon>
      </ion-button>
      <ion-button slot="end" fill="clear" color="danger" (click)="permanentlyDeleteTask(task)">
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ng-template #noDeletedTasks>
    <div class="no-deleted empty-trash">
      <ion-icon name="trash-outline" class="empty-icon"></ion-icon>
      <p class="title">{{ 'TRASH.NO_TASKS' | translate }}</p>
      <p class="muted">{{ 'TRASH.INFO' | translate }}</p>
    </div>
  </ng-template>
